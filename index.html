<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Palveluhakemisto prototyyppi B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
/* Single light look on purpose: the page mirrors the Turku service directory prototype. */
:root {
  --bg: #FFFFFF;
  --ink: #222435;
  --ink-2: #404040;
  --line: #CDCBBD;
  --soft: #F0F4F6;
  --error: #B3001F;
  --sun: #FFD239;
  --sun-light: #FFF0CD;
  --font: Roboto, Arial, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font); }
.gate { min-height: 100vh; display: grid; place-items: center; padding-inline: 16px; padding-block: 48px; box-sizing: border-box; position: relative; overflow: hidden; }
.gate-shape { position: absolute; right: -120px; bottom: -120px; width: 420px; height: 420px; border-radius: 50%; background: var(--sun-light); }
.gate-shape::after { content: ""; position: absolute; inset: 110px; border-radius: 50%; border: 80px solid var(--sun); box-sizing: border-box; }
.gate-card { position: relative; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px; }
.gate-logo { align-self: flex-start; border: 2px dashed var(--ink-2); border-radius: 4px; padding: 4px 10px; font-weight: 700; font-size: 16px; letter-spacing: .08em; }
.gate h1 { margin: 0; font-size: 36px; line-height: 44px; font-weight: 700; text-wrap: balance; }
.gate p { margin: 0; font-size: 18px; line-height: 28px; color: var(--ink-2); }
.gate form { display: flex; flex-direction: column; gap: 8px; }
.gate label { font-weight: 700; font-size: 16px; line-height: 24px; }
.gate .row { display: flex; gap: 12px; flex-wrap: wrap; }
.gate input { flex: 1 1 220px; min-width: 0; min-height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid var(--ink); border-radius: 8px; font: 400 18px/28px var(--font); color: var(--ink); background: var(--bg); }
.gate button { min-height: 56px; padding: 0 24px; border: 2px solid var(--ink); border-radius: 8px; background: var(--ink); color: var(--bg); font: 700 18px/28px var(--font); cursor: pointer; }
.gate button[disabled] { opacity: .6; cursor: progress; }
.gate .err { color: var(--error); font-size: 16px; line-height: 24px; min-height: 24px; }
.gate .note { font-size: 14px; line-height: 20px; color: var(--ink-2); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#app header :focus-visible, #app footer :focus-visible { outline-color: #FFFFFF; }
#app header[style*="sticky"] { top: env(safe-area-inset-top, 0px) !important; }
</style>

</head>
<body>
<main class="gate" id="gate">
  <div class="gate-shape" aria-hidden="true"></div>
  <div class="gate-card">
    <span class="gate-logo">TURKU</span>
    <h1>Palveluhakemisto, prototyyppi B</h1>
    <p>Työpajan prototyyppi Turun työllisyysalueelle. Sivu on suojattu salasanalla.</p>
    <form id="unlock" autocomplete="off">
      <label for="pw">Salasana</label>
      <div class="row">
        <input id="pw" name="pw" type="password" required autocomplete="current-password">
        <button id="go" type="submit">Avaa</button>
      </div>
      <div class="err" id="err" role="alert" aria-live="assertive"></div>
    </form>
    <p class="note">Esimerkkisisältö. Prototyyppi on hypoteesi, ei valmis palvelu.</p>
  </div>
</main>
<div id="app" hidden></div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let data = null, current = 'etusivu';
const mq = window.matchMedia('(max-width: 760px)');

async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(view, keepScroll) {
  current = view;
  const app = document.getElementById('app');
  app.innerHTML = data.views[view][mq.matches ? 'm' : 'd'];
  if (!keepScroll) window.scrollTo(0, 0);
}

function onClick(e) {
  const t = e.target.closest('a, button');
  if (!t) return;
  if (t.dataset.view) { e.preventDefault(); show(t.dataset.view); return; }
  if (t.dataset.totop) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.matches('a[href="#"]')) { e.preventDefault(); return; }
  if (t.matches('button[aria-pressed]')) { toggleChip(t); return; }
  if (t.matches('button[role="switch"]')) { toggleExpert(t); return; }
  if (t.matches('button')) e.preventDefault();
}

function toggleChip(btn) {
  const icon = btn.querySelector('.ms');
  if (!btn.dataset.orig) { btn.dataset.orig = btn.getAttribute('style'); btn.dataset.icon = icon.textContent; icon.dataset.orig = icon.getAttribute('style') || ''; }
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on) {
    btn.setAttribute('style', btn.dataset.orig + ';background:#222435;color:#FFFFFF');
    icon.textContent = 'check_circle';
    icon.setAttribute('style', icon.dataset.orig + ";color:#FFFFFF;font-variation-settings:'FILL' 1,'opsz' 48");
  } else {
    btn.setAttribute('style', btn.dataset.orig);
    icon.textContent = btn.dataset.icon;
    icon.setAttribute('style', icon.dataset.orig);
  }
  const n = document.querySelectorAll('#app button[aria-pressed="true"]').length;
  const cta = document.querySelector('#app [data-cta]');
  if (cta && cta.firstChild && cta.firstChild.nodeType === 3) {
    cta.firstChild.textContent = n === 0 ? 'Näytä kaikki palvelut' : 'Näytä palvelut (' + n + (n === 1 ? ' valinta)' : ' valintaa)');
  }
}

function toggleExpert(sw) {
  const hide = sw.getAttribute('aria-checked') !== 'true';
  sw.setAttribute('aria-checked', hide ? 'true' : 'false');
  const sec = document.getElementById('asiantuntija');
  if (sec) sec.hidden = hide;
  document.querySelectorAll('#app a[href="#asiantuntija"]').forEach((a) => { const li = a.closest('li'); if (li) li.hidden = hide; });
  const txt = document.querySelector('#app [data-bartext]');
  if (txt) txt.textContent = hide ? 'Asiakasnäkymä päällä: asiantuntijatiedot on piilotettu. Voit jakaa ruudun asiakkaalle.' : 'Olet kirjautunut asiantuntijana. Näet myös vain asiantuntijoille tarkoitetut tiedot.';
  const track = sw.querySelector('span[aria-hidden]');
  if (track) {
    track.style.background = hide ? '#222435' : '#FFFFFF';
    track.style.justifyContent = hide ? 'flex-end' : 'flex-start';
    const knob = track.firstElementChild;
    if (knob) knob.style.background = hide ? '#FFFFFF' : '#222435';
  }
}

document.getElementById('unlock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  err.textContent = '';
  go.disabled = true; go.textContent = 'Avataan…';
  try {
    data = await decrypt(pw);
    const st = document.createElement('style');
    st.textContent = data.style;
    document.head.appendChild(st);
    document.getElementById('gate').hidden = true;
    const app = document.getElementById('app');
    app.hidden = false;
    app.addEventListener('click', onClick);
    app.addEventListener('submit', (ev) => ev.preventDefault());
    mq.addEventListener('change', () => show(current, true));
    show('etusivu');
  } catch (x) {
    err.textContent = 'Salasana ei kelpaa. Tarkista isot kirjaimet ja erikoismerkit ja yritä uudelleen.';
    go.disabled = false; go.textContent = 'Avaa';
    document.getElementById('pw').select();
  }
});
</script>
